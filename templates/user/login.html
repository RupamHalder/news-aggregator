{% extends "base.html" %}
{% block content %}

<main class="main">

    <!-- Page Title -->
    <div class="page-title light-background">
        <div class="container">
            <h1>{{ page_info.get('page_heading') }}</h1>
        </div>
    </div><!-- End Page Title -->

    <!-- Contact Section -->
    <section id="contact" class="contact section">

        <div class="container" data-aos="fade">

            <div class="row gy-5 gx-lg-5">

                <div class="col-lg-4"></div>

                <div class="col-lg-4">
                    <form class="php-email-form">
                        <div class="row">
                            <div class="col-md-12 form-group mt-3 mt-md-0">
                                <input type="email" class="form-control" name="email" id="email"
                                       placeholder="Your Email" required="">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 input-group mt-3 mt-md-0">
                                <input type="password" name="password" class="form-control"
                                       id="password" placeholder="Your Password" required="">
                                <span class="input-group-text" id="togglePassword" style="cursor: pointer;">
                                    <i class="bi bi-eye-slash"></i>
                                </span>
                            </div>
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit">Login</button>
                        </div>
                        <div class="mt-3">
                            New User? <a href="/register">Create Account</a>
                        </div>
                    </form>
                </div><!-- End Contact Form -->

                <div class="col-lg-4"></div>

            </div>

        </div>

    </section><!-- /Contact Section -->

</main>

{% endblock content %}

{% block page_js %}
<script src="{{ url_for('static', filename='custom/js/user/login.js') }}" type="text/javascript"></script>
{% endblock page_js %}
